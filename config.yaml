# fullsend organization configuration
# https://github.com/fullsend-ai/fullsend
#
# This file is managed by fullsend. Manual edits may be overwritten.
version: "1"
dispatch:
    platform: github-actions
defaults:
    roles:
        - classify
        - triage
        - review
        - fix
        - coder
        - fullsend
    max_implementation_retries: 2
    auto_merge: false
agents:
    - role: classify
      name: ascerra-fullsend-lab-classify
      slug: ascerra-fullsend-lab-classify
repos:
    .fullsend:
        enabled: false
    fix-agent-test:
        enabled: true
    human-pr-fix-test:
        enabled: true
