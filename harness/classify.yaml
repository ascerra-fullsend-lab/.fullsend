agent: agents/classify.md
model: opus
image: ghcr.io/fullsend-ai/fullsend-sandbox:latest
policy: policies/classify.yaml

host_files:
  - src: env/gcp-vertex.env
    dest: /tmp/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/workspace/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /tmp/workspace/.gcp-oidc-token
    optional: true
  - src: env/classify.env
    dest: /tmp/workspace/.env.d/classify.env
    expand: true

skills: []

pre_script: scripts/pre-classify.sh

validation_loop:
  script: scripts/validate-output-schema.sh
  max_iterations: 2

post_script: scripts/post-classify.sh

runner_env:
  GH_TOKEN: ${GH_TOKEN}
  CLASSIFY_SOURCE_REPO: ${CLASSIFY_SOURCE_REPO}
  CLASSIFY_MODE: ${CLASSIFY_MODE}
  CLASSIFY_CORE_TEAM: ${CLASSIFY_CORE_TEAM}
  FULLSEND_OUTPUT_SCHEMA: ${FULLSEND_DIR}/schemas/classify-result.schema.json

timeout_minutes: 15
